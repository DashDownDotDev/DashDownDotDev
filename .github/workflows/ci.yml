on:
  push:
    branches:
      - main
  pull_request:
name: ci
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v2
        with:
          node-version-file: package.json
      - run: pnpm i --frozen-lockfile
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
