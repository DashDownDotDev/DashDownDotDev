on:
  push:
    branches:
      - main
  pull_request:
name: ci
permissions:
  contents: read
env:
  NODE_VERSION: 25
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v2
        with:
          node-version: $NODE_VERSION
      - run: pnpm i
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
